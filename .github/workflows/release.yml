name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SOURCE_LM_PRICE_LABEL: ${{ vars.SOURCE_LM_PRICE_LABEL }}
  SOURCE_LM_CHECKOUT_URL: ${{ vars.SOURCE_LM_CHECKOUT_URL }}
  SOURCE_LM_VARIANT_ID: ${{ vars.SOURCE_LM_VARIANT_ID }}
  SOURCE_LM_FREE_QUOTA: ${{ vars.SOURCE_LM_FREE_QUOTA }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify tag matches manifest/package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF_NAME#v}
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$MANIFEST_VERSION" != "$TAG" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) does not match tag ($TAG)" >&2
            exit 1
          fi
          if [ "$PACKAGE_VERSION" != "$TAG" ]; then
            echo "package.json version ($PACKAGE_VERSION) does not match tag ($TAG)" >&2
            exit 1
          fi

      - run: npm test
      - run: npx tsc --noEmit

      # Storefront values are public (they end up in dist/popup.js) but must be
      # the LIVE ones: without them license.ts falls back to REPLACE-ME and an
      # empty variant id, which disables the cross-product license check.
      - name: Require live Lemon Squeezy values (repo Variables)
        run: |
          case "$SOURCE_LM_CHECKOUT_URL" in
            ''|*REPLACE-ME*) echo "Set repo variable SOURCE_LM_CHECKOUT_URL" >&2; exit 1;;
          esac
          [ -n "$SOURCE_LM_VARIANT_ID" ] || { echo "Set repo variable SOURCE_LM_VARIANT_ID" >&2; exit 1; }

      - run: npm run build

      - name: Package extension
        run: |
          NAME="source-lm-${GITHUB_REF_NAME}.zip"
          zip -r "$NAME" manifest.json icons dist src/popup/popup.html src/popup/popup.css
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Sanity-check package contents
        run: |
          TMP_DIR=$(mktemp -d)
          unzip -q "$ZIP_NAME" -d "$TMP_DIR"
          for f in manifest.json dist/popup.js dist/content.js dist/youtube.js icons/icon-128.png src/popup/popup.html src/popup/popup.css; do
            if [ ! -f "$TMP_DIR/$f" ]; then
              echo "Missing $f in $ZIP_NAME" >&2
              exit 1
            fi
          done
          rm -rf "$TMP_DIR"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
